<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة - مَثَانِي</title>
    <style>
        /* ============================================
           المتغيرات الأساسية (الثيم الداكن افتراضي)
           ============================================ */
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-color: #c5a880;
            --accent-glow: rgba(197, 168, 128, 0.15);
            --border-color: rgba(197, 168, 128, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --btn-text: #121214;
            --gradient-start: #c5a880;
            --gradient-end: #d4b896;
        }

        /* ============================================
           الثيم الفاتح (يُطبق عبر JS)
           ============================================ */
        body.light-ivory {
            --bg-dark: #faf8f5;
            --bg-card: #fffef7;
            --text-main: #1e3a2f;
            --text-muted: #4a6b4a;
            --accent-color: #876836;
            --accent-glow: rgba(139, 94, 60, 0.1);
            --border-color: rgba(139, 94, 60, 0.15);
            --shadow-color: rgba(0, 0, 0, 0.08);
            --btn-text: #ffffff;
            --gradient-start: #876836;
            --gradient-end: #a8844a;
        }

        /* ============================================
           التنسيقات العامة
           ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* ============================================
           البطاقة الرئيسية
           ============================================ */
        .error-container {
            max-width: 420px;
            width: 100%;
            padding: 50px 30px;
            background: var(--bg-card);
            border-radius: 24px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px var(--shadow-color);
            position: relative;
            overflow: hidden;
            transition: background 0.4s ease, border-color 0.4s ease;
        }

        /* ============================================
           التموج الذهبي الناعم (يتكيف مع الثيم)
           ============================================ */
        .error-container::before {
            content: '';
            position: absolute;
            inset: -50%;
            background: radial-gradient(circle at 70% 30%, var(--accent-glow) 0%, transparent 60%);
            animation: softGlow 8s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
            transition: background 0.4s ease;
        }

        .error-container > * {
            position: relative;
            z-index: 1;
        }

        @keyframes softGlow {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.3;
            }
            100% {
                transform: translate(-10%, -10%) scale(1.3);
                opacity: 0.7;
            }
        }

        /* ============================================
           المحتوى
           ============================================ */
        .error-icon {
            font-size: 4.5rem;
            display: block;
            margin-bottom: 8px;
            animation: gentleFloat 3s ease-in-out infinite;
        }

        @keyframes gentleFloat {
            0% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0); }
        }

        .number-404 {
            font-size: 6rem;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(135deg, var(--gradient-start) 0%, var(--gradient-end) 50%, var(--gradient-start) 100%);
            background-clip: text;
            -webkit-background-clip: text;
            line-height: 1;
            margin-bottom: 4px;
            letter-spacing: 4px;
            opacity: 0.8;
            transition: background 0.4s ease;
        }

        .dua {
            font-size: 1.3rem;
            color: var(--accent-color);
            font-weight: 500;
            margin: 12px 0 8px;
            line-height: 1.8;
            font-family: 'Amiri', serif;
            transition: color 0.3s ease;
        }

        .dua-sub {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            transition: color 0.3s ease;
        }

        .message {
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.8;
            margin-bottom: 20px;
            transition: color 0.3s ease;
        }

        /* ============================================
           الأزرار
           ============================================ */
        .btn-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .btn {
            display: inline-block;
            padding: 12px 32px;
            background: var(--accent-color);
            color: var(--btn-text);
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s, color 0.2s;
            width: 100%;
            max-width: 280px;
            box-sizing: border-box;
        }

        .btn:hover {
            transform: scale(1.03);
            background: #d4b896;
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-color);
            border: 1px solid var(--accent-color);
        }

        .btn-secondary:hover {
            background: var(--accent-glow);
        }

        .sub-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 20px;
            opacity: 0.7;
            transition: color 0.3s ease;
        }

        /* ============================================
           مربع البحث
           ============================================ */
        .search-box {
            margin-top: 16px;
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .search-box input {
            padding: 10px 16px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.04);
            color: var(--text-main);
            font-size: 0.9rem;
            flex: 1;
            min-width: 180px;
            outline: none;
            transition: border-color 0.2s, background 0.3s;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
        }

        .search-box .btn {
            max-width: 120px;
            padding: 10px 20px;
        }

        body.light-ivory .search-box input {
            background: rgba(0, 0, 0, 0.04);
        }

        /* ============================================
           استجابة للشاشات الصغيرة
           ============================================ */
        @media (max-width: 480px) {
            .number-404 {
                font-size: 4.5rem;
            }
            .dua {
                font-size: 1.1rem;
            }
        }
    </style>

    <script>
        // ============================================
        // 🎨 تطبيق الثيم المحفوظ فوراً
        // ============================================
        (function() {
            const savedTheme = localStorage.getItem('quran_theme') || 'dark-obsidian';
            document.body.className = savedTheme;

            const bgColor = savedTheme === 'light-ivory' ? '#faf8f5' : '#121214';
            document.documentElement.style.backgroundColor = bgColor;
        })();

        // ============================================
        // 🔍 وظيفة البحث
        // ============================================
        function searchSurah() {
            const input = document.getElementById('searchSurah');
            const query = input.value.trim();
            if (query) {
                window.location.href = '/?search=' + encodeURIComponent(query);
            } else {
                alert('الرجاء كتابة اسم السورة أو رقمها');
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('searchSurah');
            if (input) {
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter') {
                        searchSurah();
                    }
                });
            }
        });
    </script>
</head>
<body>
    <div class="error-container">
        <span class="error-icon">🕌</span>
        <div class="number-404">404</div>
        <div class="dua">﴿ سُبْحَانَ اللَّهِ وَبِحَمْدِهِ ﴾</div>
        <div class="dua-sub">عدد خلقه، ورضا نفسه، وزنة عرشه، ومداد كلماته</div>
        <p class="message">
            يبدو أن الصفحة التي تبحث عنها قد انتقلت أو لم تعد موجودة.<br>
            لكن لا تحزن، فالقرآن بين يديك.
        </p>

        <div class="btn-group">
            <a href="/" class="btn">🏠 العودة إلى المصحف</a>
            <button class="btn btn-secondary" onclick="history.back()">↩️ العودة للصفحة السابقة</button>
        </div>

        <div class="search-box">
            <input type="text" id="searchSurah" placeholder="ابحث عن سورة..." dir="rtl">
            <button class="btn" onclick="searchSurah()" style="max-width:100px; padding:10px 16px;">🔍</button>
        </div>

        <p class="sub-text">📖 مَثَانِي • مصحفك الذكي للحفظ والتدبر</p>
    </div>
</body>
</html>
